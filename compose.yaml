name: bigdata-training
services:
  reports-init:
    image: alpine:3.22.5
    restart: 'no'
    user: 0:0
    command:
    - /bin/sh
    - -ec
    - mkdir -p /reports && (chmod 0777 /reports 2>/dev/null || true)
    volumes:
    - ./reports:/reports
  ports-check:
    depends_on:
      reports-init:
        condition: service_completed_successfully
    image: bigdata-training/ports-check:local
    build:
      context: ./docker/ports-check
    restart: 'no'
    user: 0:0
    environment:
      POSTGRES_PORT: ${POSTGRES_PORT:-25001}
      KAFKA_EXTERNAL_PORT: ${KAFKA_EXTERNAL_PORT:-25002}
      S3_API_PORT: ${S3_API_PORT:-25003}
      S3_CONSOLE_PORT: ${S3_CONSOLE_PORT:-25004}
      ICEBERG_REST_PORT: ${ICEBERG_REST_PORT:-25005}
      SPARK_MASTER_UI_PORT: ${SPARK_MASTER_UI_PORT:-25006}
      SPARK_WORKER1_UI_PORT: ${SPARK_WORKER1_UI_PORT:-25007}
      SPARK_WORKER2_UI_PORT: ${SPARK_WORKER2_UI_PORT:-25008}
      SPARK_HISTORY_UI_PORT: ${SPARK_HISTORY_UI_PORT:-25009}
      JUPYTER_PORT: ${JUPYTER_PORT:-25010}
      SPARK_JOBS_UI_PORT: ${SPARK_JOBS_UI_PORT:-25011}
      TRINO_PORT: ${TRINO_PORT:-25012}
      MOCK_OPENDATA_PORT: ${MOCK_OPENDATA_PORT:-25013}
      AIRFLOW_PORT: ${AIRFLOW_PORT:-25014}
      PGADMIN_PORT: ${PGADMIN_PORT:-25017}
      KAFKA_UI_PORT: ${KAFKA_UI_PORT:-25018}
      DRUID_PORT: ${DRUID_PORT:-25019}
      SUPERSET_PORT: ${SUPERSET_PORT:-25020}
      DASHBOARD_PORT: ${DASHBOARD_PORT:-25021}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-bigdata-training}
    volumes:
    - .:/project:ro
    - /var/run/docker.sock:/var/run/docker.sock
    - ./reports:/reports
    networks:
    - training-net
  workspace-init:
    depends_on:
      reports-init:
        condition: service_completed_successfully
    image: bigdata-training/spark-runtime:local
    build:
      context: .
      dockerfile: spark/runtime/Dockerfile
    user: 0:0
    restart: 'no'
    entrypoint:
    - python3
    - /workspace-init.py
    volumes:
    - ./docker/workspace-init.py:/workspace-init.py:ro
    - ./donnees:/seed/donnees:ro
    - ./spark/jobs:/seed/jobs:ro
    - spark-data:/opt/spark/donnees
    - spark-jobs:/opt/spark/jobs
    - ./reports:/reports
    networks:
    - training-net
  postgres-source:
    depends_on:
      ports-check:
        condition: service_completed_successfully
    image: postgres:17.11-alpine
    restart: unless-stopped
    mem_limit: 768m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-formation}
      POSTGRES_USER: ${POSTGRES_USER:-formation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-formation}
    ports:
    - 127.0.0.1:${POSTGRES_PORT:-25001}:5432
    volumes:
    - postgres-source-data:/var/lib/postgresql/data
    - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-formation} -d ${POSTGRES_DB:-formation}
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 5s
    networks:
    - training-net
  postgres-bootstrap:
    image: postgres:17.11-alpine
    restart: 'no'
    mem_limit: 256m
    depends_on:
      postgres-source:
        condition: service_healthy
    environment:
      PGHOST: postgres-source
      PGPORT: '5432'
      PGDATABASE: ${POSTGRES_DB:-formation}
      PGUSER: ${POSTGRES_USER:-formation}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
    - ./postgres/init:/sql:ro
    entrypoint:
    - /bin/sh
    - -ec
    command:
    - 'psql -v ON_ERROR_STOP=1 -f /sql/01_schema.sql

      psql -v ON_ERROR_STOP=1 -f /sql/02_seed.sql

      count="$$(psql -v ON_ERROR_STOP=1 -Atc ''select count(*) from public.customers'')"

      case "$$count" in ''''|*[!0-9]*) echo "invalid customer count: $$count" >&2; exit 31 ;; esac

      test "$$count" -ge 5 || { echo "expected >=5 customers, got $$count" >&2; exit 32; }

      echo "POSTGRES_BOOTSTRAP_OK customers=$$count"

      '
    networks:
    - training-net
  kafka:
    depends_on:
      ports-check:
        condition: service_completed_successfully
    image: apache/kafka:4.3.1
    restart: unless-stopped
    mem_limit: 1g
    environment:
      KAFKA_HEAP_OPTS: -Xms384m -Xmx512m
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:${KAFKA_EXTERNAL_PORT:-25002}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-4L6g3nShT-eMCtK--X86sw}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
    - 127.0.0.1:${KAFKA_EXTERNAL_PORT:-25002}:9092
    volumes:
    - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
      - CMD-SHELL
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s
    networks:
    - training-net
  kafka-init:
    image: bigdata-training/bootstrap:local
    restart: 'no'
    mem_limit: 384m
    environment:
      KAFKA_BOOTSTRAP_SERVER: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
    - python
    - /app/kafka_init.py
    networks:
    - training-net
    build:
      context: ./docker/bootstrap
  objectstore-permissions:
    image: alpine:3.22.5
    restart: 'no'
    mem_limit: 64m
    user: 0:0
    command:
    - /bin/sh
    - -ec
    - chown -R 10001:10001 /data
    volumes:
    - objectstore-data:/data
    networks:
    - training-net
  objectstore:
    image: rustfs/rustfs:1.0.0-rc.6
    restart: unless-stopped
    mem_limit: 1g
    depends_on:
      ports-check:
        condition: service_completed_successfully
      objectstore-permissions:
        condition: service_completed_successfully
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: :9000
      RUSTFS_CONSOLE_ADDRESS: :9001
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-TRAINING_ONLY_S3_PASSWORD}
      RUSTFS_REGION: ${AWS_REGION:-us-east-1}
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: 'true'
      RUSTFS_OBS_LOGGER_LEVEL: warn
    ports:
    - 127.0.0.1:${S3_API_PORT:-25003}:9000
    - 127.0.0.1:${S3_CONSOLE_PORT:-25004}:9001
    volumes:
    - objectstore-data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://127.0.0.1:9000/health/ready >/dev/null
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
    - training-net
  objectstore-init:
    image: bigdata-training/objectstore-init:local
    build:
      context: ./docker/objectstore-init
    restart: 'no'
    mem_limit: 256m
    depends_on:
      objectstore:
        condition: service_healthy
    environment:
      S3_ENDPOINT: http://objectstore:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-labadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-TRAINING_ONLY_S3_PASSWORD}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      REQUIRED_BUCKETS: warehouse,lakehouse,checkpoints,druid
      DATA_DIR: /seed/data
    volumes:
    - ./donnees:/seed/data:ro
    networks:
    - training-net
  iceberg-catalog-permissions:
    image: alpine:3.22.5
    restart: 'no'
    mem_limit: 64m
    user: 0:0
    command:
    - /bin/sh
    - -ec
    - chown -R 1000:1000 /catalog
    volumes:
    - iceberg-catalog-data:/catalog
    networks:
    - training-net
  iceberg-rest:
    image: apache/iceberg-rest-fixture@sha256:db8de90b5b7693d4ac334c336f91d9bbe320d7b19f4f514d26de84cdfbcbfe8d
    restart: unless-stopped
    mem_limit: 768m
    depends_on:
      ports-check:
        condition: service_completed_successfully
      objectstore-init:
        condition: service_completed_successfully
      iceberg-catalog-permissions:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-labadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://objectstore:9000
      CATALOG_S3_PATH__STYLE__ACCESS: 'true'
      CATALOG_URI: jdbc:sqlite:/var/lib/iceberg/catalog.db
      CATALOG_CLIENTS: '1'
      CATALOG_JDBC_SCHEMA__VERSION: V1
      CATALOG_JDBC_STRICT__MODE: 'true'
    ports:
    - 127.0.0.1:${ICEBERG_REST_PORT:-25005}:8181
    volumes:
    - iceberg-catalog-data:/var/lib/iceberg
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://127.0.0.1:8181/v1/config >/dev/null
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
    - training-net
  spark-master:
    image: bigdata-training/spark-runtime:local
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-labadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-TRAINING_ONLY_S3_PASSWORD}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      SPARK_NO_DAEMONIZE: 'true'
      PYSPARK_PYTHON: python3
      SPARK_LOG_DIR: /tmp/spark-logs
      SPARK_PID_DIR: /tmp/spark-pids
      SPARK_DAEMON_MEMORY: 512m
    volumes:
    - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    - ./spark/conf/log4j2.properties:/opt/spark/conf/log4j2.properties:ro
    - spark-jobs:/opt/spark/jobs
    - ./spark/notebooks:/opt/spark/notebooks
    - spark-data:/opt/spark/donnees
    networks: &id001
    - training-net
    build:
      context: .
      dockerfile: spark/runtime/Dockerfile
    hostname: spark-master
    mem_limit: 2g
    command:
    - /opt/spark/bin/spark-class
    - org.apache.spark.deploy.master.Master
    - --host
    - spark-master
    - --port
    - '7077'
    - --webui-port
    - '8080'
    ports:
    - 127.0.0.1:${SPARK_MASTER_UI_PORT:-25006}:8080
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import socket; s=socket.create_connection(('spark-master',7077),3); s.close()
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on:
      ports-check:
        condition: service_completed_successfully
      workspace-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      objectstore-init:
        condition: service_completed_successfully
      iceberg-rest:
        condition: service_healthy
  spark-worker-1:
    image: bigdata-training/spark-runtime:local
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-labadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-TRAINING_ONLY_S3_PASSWORD}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      SPARK_NO_DAEMONIZE: 'true'
      PYSPARK_PYTHON: python3
      SPARK_LOG_DIR: /tmp/spark-logs
      SPARK_PID_DIR: /tmp/spark-pids
      SPARK_DAEMON_MEMORY: 512m
    volumes:
    - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    - ./spark/conf/log4j2.properties:/opt/spark/conf/log4j2.properties:ro
    - spark-jobs:/opt/spark/jobs
    - ./spark/notebooks:/opt/spark/notebooks
    - spark-data:/opt/spark/donnees
    networks: *id001
    hostname: spark-worker-1
    mem_limit: 1536m
    command:
    - /opt/spark/bin/spark-class
    - org.apache.spark.deploy.worker.Worker
    - spark://spark-master:7077
    - --cores
    - '2'
    - --memory
    - 1g
    - --webui-port
    - '8081'
    ports:
    - 127.0.0.1:${SPARK_WORKER1_UI_PORT:-25007}:8081
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import socket; s=socket.create_connection(('spark-worker-1',8081),3); s.close()
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on:
      ports-check:
        condition: service_completed_successfully
      workspace-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_healthy
    build:
      context: .
      dockerfile: spark/runtime/Dockerfile
  spark-worker-2:
    image: bigdata-training/spark-runtime:local
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-labadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-TRAINING_ONLY_S3_PASSWORD}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      SPARK_NO_DAEMONIZE: 'true'
      PYSPARK_PYTHON: python3
      SPARK_LOG_DIR: /tmp/spark-logs
      SPARK_PID_DIR: /tmp/spark-pids
      SPARK_DAEMON_MEMORY: 512m
    volumes:
    - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    - ./spark/conf/log4j2.properties:/opt/spark/conf/log4j2.properties:ro
    - spark-jobs:/opt/spark/jobs
    - ./spark/notebooks:/opt/spark/notebooks
    - spark-data:/opt/spark/donnees
    networks: *id001
    hostname: spark-worker-2
    mem_limit: 1536m
    command:
    - /opt/spark/bin/spark-class
    - org.apache.spark.deploy.worker.Worker
    - spark://spark-master:7077
    - --cores
    - '2'
    - --memory
    - 1g
    - --webui-port
    - '8081'
    ports:
    - 127.0.0.1:${SPARK_WORKER2_UI_PORT:-25008}:8081
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import socket; s=socket.create_connection(('spark-worker-2',8081),3); s.close()
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on:
      ports-check:
        condition: service_completed_successfully
      workspace-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_healthy
    build:
      context: .
      dockerfile: spark/runtime/Dockerfile
  spark-history:
    image: bigdata-training/spark-runtime:local
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-labadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-TRAINING_ONLY_S3_PASSWORD}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      SPARK_NO_DAEMONIZE: 'true'
      PYSPARK_PYTHON: python3
      SPARK_LOG_DIR: /tmp/spark-logs
      SPARK_PID_DIR: /tmp/spark-pids
      SPARK_DAEMON_MEMORY: 512m
    volumes:
    - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    - ./spark/conf/log4j2.properties:/opt/spark/conf/log4j2.properties:ro
    - spark-jobs:/opt/spark/jobs
    - ./spark/notebooks:/opt/spark/notebooks
    - spark-data:/opt/spark/donnees
    networks: *id001
    hostname: spark-history
    mem_limit: 1g
    command:
    - /opt/spark/bin/spark-class
    - org.apache.spark.deploy.history.HistoryServer
    ports:
    - 127.0.0.1:${SPARK_HISTORY_UI_PORT:-25009}:18080
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import socket; s=socket.create_connection(('spark-history',18080),3); s.close()
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 15s
    depends_on:
      ports-check:
        condition: service_completed_successfully
      workspace-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_healthy
      objectstore-init:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: spark/runtime/Dockerfile
  spark-jupyter:
    image: bigdata-training/spark-runtime:local
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-labadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-TRAINING_ONLY_S3_PASSWORD}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      SPARK_NO_DAEMONIZE: 'true'
      HOME: /home/spark
      XDG_CONFIG_HOME: /home/spark/.config
      XDG_CACHE_HOME: /home/spark/.cache
      XDG_DATA_HOME: /home/spark/.local/share
      JUPYTER_CONFIG_DIR: /home/spark/.jupyter
      JUPYTER_DATA_DIR: /home/spark/.local/share/jupyter
      JUPYTER_RUNTIME_DIR: /home/spark/.local/share/jupyter/runtime
      PYTHONPATH: /opt/spark/python:/opt/spark/python/lib/py4j-src.zip
      SPARK_LOCAL_IP: spark-jupyter
      SPARK_MASTER_URL: spark://spark-master:7077
      PYSPARK_PYTHON: python3
      PYSPARK_DRIVER_PYTHON: python3
      PYSPARK_SUBMIT_ARGS: --master spark://spark-master:7077 --conf spark.driver.host=spark-jupyter --conf spark.driver.bindAddress=0.0.0.0
        --conf spark.ui.enabled=true --conf spark.ui.port=4040 pyspark-shell
      JUPYTER_TOKEN: ${JUPYTER_TOKEN}
      SPARK_LOG_DIR: /tmp/spark-logs
      SPARK_PID_DIR: /tmp/spark-pids
      SPARK_DAEMON_MEMORY: 512m
    volumes:
    - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    - ./spark/conf/log4j2.properties:/opt/spark/conf/log4j2.properties:ro
    - spark-jobs:/opt/spark/jobs
    - spark-data:/opt/spark/donnees
    - spark-notebooks:/opt/spark/notebooks
    networks: *id001
    hostname: spark-jupyter
    user: spark
    mem_limit: 2g
    command:
    - python3
    - -m
    - jupyter
    - lab
    - --ip=0.0.0.0
    - --port=8888
    - --no-browser
    - --ServerApp.root_dir=/opt/spark/notebooks
    - --IdentityProvider.token=${JUPYTER_TOKEN:-CHANGE_ME}
    - --ServerApp.password=
    ports:
    - 127.0.0.1:${JUPYTER_PORT:-25010}:8888
    - 127.0.0.1:${SPARK_JOBS_UI_PORT:-25011}:4040
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import socket; s=socket.create_connection(('127.0.0.1',8888),3); s.close()
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
    depends_on:
      ports-check:
        condition: service_completed_successfully
      workspace-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_healthy
      spark-worker-1:
        condition: service_healthy
      spark-worker-2:
        condition: service_healthy
      notebooks-init:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: spark/runtime/Dockerfile
  trino:
    image: trinodb/trino:483
    restart: unless-stopped
    mem_limit: 2g
    depends_on:
      ports-check:
        condition: service_completed_successfully
      postgres-bootstrap:
        condition: service_completed_successfully
      iceberg-rest:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-labadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-TRAINING_ONLY_S3_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-formation}
      POSTGRES_USER: ${POSTGRES_USER:-formation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
    - 127.0.0.1:${TRINO_PORT:-25012}:8080
    volumes:
    - ./trino/catalog:/etc/trino/catalog:ro
    - ./trino/etc/jvm.config:/etc/trino/jvm.config:ro
    healthcheck:
      test:
      - CMD-SHELL
      - 'curl -fsS http://127.0.0.1:8080/v1/info | grep -Eq ''"starting"[[:space:]]*:[[:space:]]*false'' '
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
    networks:
    - training-net
  mock-opendata:
    depends_on:
      ports-check:
        condition: service_completed_successfully
    image: bigdata-training/mock-opendata:local
    build:
      context: ./docker/mock-opendata
    profiles:
    - demo
    - full
    restart: unless-stopped
    mem_limit: 256m
    environment:
      DATA_FILE: /data/opendata/sample.json
    volumes:
    - ./donnees:/data:ro
    ports:
    - 127.0.0.1:${MOCK_OPENDATA_PORT:-25013}:8000
    healthcheck:
      test:
      - CMD
      - python
      - -c
