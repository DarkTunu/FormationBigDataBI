    - gunicorn
    command:
    - --bind
    - 0.0.0.0:8088
    - --workers
    - '2'
    - --timeout
    - '120'
    - superset.app:create_app()
    ports:
    - 127.0.0.1:${SUPERSET_PORT:-25020}:8088
    depends_on:
      ports-check:
        condition: service_completed_successfully
      superset-init:
        condition: service_completed_successfully
      ebrasil-druid-init:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8088/health', timeout=5)
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 30s
    networks:
    - training-net
  integration-check:
    depends_on:
      workspace-init:
        condition: service_completed_successfully
    image: bigdata-training/spark-runtime:local
    build:
      context: .
      dockerfile: spark/runtime/Dockerfile
    profiles:
    - checks
    user: spark
    restart: 'no'
    hostname: integration-check
    entrypoint:
    - python3
    - /checks/run_logged.py
    - --name
    - integration-check
    - --log-dir
    - /reports
    - --
    - python3
    - /checks/integration.py
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-labadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-TRAINING_ONLY_S3_PASSWORD}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      SPARK_NO_DAEMONIZE: 'true'
      PYSPARK_PYTHON: python3
      SPARK_LOG_DIR: /tmp/spark-logs
      SPARK_PID_DIR: /tmp/spark-pids
      SPARK_DAEMON_MEMORY: 512m
      POSTGRES_DB: ${POSTGRES_DB:-formation}
      POSTGRES_USER: ${POSTGRES_USER:-formation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-formation}
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-formation}
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-CHANGE_ME}
    volumes:
    - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    - ./spark/conf/log4j2.properties:/opt/spark/conf/log4j2.properties:ro
    - spark-jobs:/opt/spark/jobs
    - spark-data:/opt/spark/donnees
    - ./checks:/checks:ro
    - ./reports:/reports
    - ./docker:/producers:ro
    networks:
    - training-net
  airflow-check:
    depends_on:
      workspace-init:
        condition: service_completed_successfully
    image: bigdata-training/airflow:local
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    profiles:
    - checks
    hostname: airflow-check
    entrypoint:
    - python3
    - /checks/run_logged.py
    - --name
    - airflow-check
    - --log-dir
    - /reports
    - --
    - python3
    - /checks/airflow_check.py
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: 'true'
      AIRFLOW_CONN_SPARK_DEFAULT: spark://spark-master:7077?deploy-mode=client
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-labadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-TRAINING_ONLY_S3_PASSWORD}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      SPARK_CONF_DIR: /opt/spark/conf
      SPARK_LOCAL_IP: airflow-check
      PYSPARK_PYTHON: python3
      PYSPARK_DRIVER_PYTHON: python3
      POSTGRES_DB: ${POSTGRES_DB:-formation}
      POSTGRES_USER: ${POSTGRES_USER:-formation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-formation}
    volumes:
    - spark-jobs:/opt/spark/jobs:ro
    - ./spark/conf:/opt/spark/conf:ro
    - spark-data:/opt/spark/donnees:ro
    - ./checks:/checks:ro
    - ./airflow/dags:/opt/airflow/dags:ro
    - ./reports:/reports
    networks:
    - training-net
    user: airflow
  dashboard:
    depends_on:
      ports-check:
        condition: service_completed_successfully
    image: python:3.12-slim
    restart: unless-stopped
    entrypoint:
    - python
    - /app/server.py
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-formation}
      POSTGRES_USER: ${POSTGRES_USER:-formation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-formation}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-labadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-TRAINING_ONLY_S3_PASSWORD}
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-CHANGE_ME}
      PGADMIN_EMAIL: ${PGADMIN_EMAIL:-admin@formation.fr}
      PGADMIN_PASSWORD: ${PGADMIN_PASSWORD:-formation}
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-formation}
      S3_CONSOLE_PORT: ${S3_CONSOLE_PORT:-25004}
      PGADMIN_PORT: ${PGADMIN_PORT:-25017}
      KAFKA_UI_PORT: ${KAFKA_UI_PORT:-25018}
      SPARK_MASTER_UI_PORT: ${SPARK_MASTER_UI_PORT:-25006}
      SPARK_WORKER1_UI_PORT: ${SPARK_WORKER1_UI_PORT:-25007}
      SPARK_WORKER2_UI_PORT: ${SPARK_WORKER2_UI_PORT:-25008}
      SPARK_HISTORY_UI_PORT: ${SPARK_HISTORY_UI_PORT:-25009}
      SPARK_JOBS_UI_PORT: ${SPARK_JOBS_UI_PORT:-25011}
      JUPYTER_PORT: ${JUPYTER_PORT:-25010}
      TRINO_PORT: ${TRINO_PORT:-25012}
      AIRFLOW_PORT: ${AIRFLOW_PORT:-25014}
      DRUID_PORT: ${DRUID_PORT:-25019}
      SUPERSET_PORT: ${SUPERSET_PORT:-25020}
      ICEBERG_REST_PORT: ${ICEBERG_REST_PORT:-25005}
    ports:
    - 127.0.0.1:${DASHBOARD_PORT:-25021}:8090
    volumes:
    - ./dashboard:/app:ro
    - ./reports:/reports:ro
    networks:
    - training-net
  pgadmin-config:
    image: python:3.12-slim
    restart: 'no'
    entrypoint:
    - python
    - /init/pgadmin.py
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-formation}
      POSTGRES_DB: ${POSTGRES_DB:-formation}
    volumes:
    - ./docker/bootstrap/pgadmin.py:/init/pgadmin.py:ro
    - pgadmin-config:/config
    networks:
    - training-net
  static-check:
    depends_on:
      reports-init:
        condition: service_completed_successfully
    image: bigdata-training/bootstrap:local
    build:
      context: ./docker/bootstrap
    profiles:
    - checks
    entrypoint:
    - python
    - /project/checks/run_logged.py
    - --name
    - static-check
    - --log-dir
    - /reports
    - --
    - python
    - /project/tools/static_validate.py
    volumes:
    - .:/project:ro
    - ./reports:/reports
  ebrasil-silver-init:
    image: bigdata-training/spark-runtime:local
    build:
      context: .
      dockerfile: spark/runtime/Dockerfile
    profiles:
    - analytics
    - full
    - checks
    restart: 'no'
    user: spark
    mem_limit: 2g
    hostname: ebrasil-silver-init
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-labadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-TRAINING_ONLY_S3_PASSWORD}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      SPARK_NO_DAEMONIZE: 'true'
      SPARK_LOCAL_IP: ebrasil-silver-init
      PYSPARK_PYTHON: python3
      PYSPARK_DRIVER_PYTHON: python3
    entrypoint:
    - /opt/spark/bin/spark-submit
    - --master
    - spark://spark-master:7077
    - --conf
    - spark.driver.host=ebrasil-silver-init
    - --conf
    - spark.driver.bindAddress=0.0.0.0
    - --driver-memory
    - 768m
    - --conf
    - spark.driver.maxResultSize=128m
    - /app/20_build_ebrasil_warehouse.py
    volumes:
    - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    - ./spark/jobs/20_build_ebrasil_warehouse.py:/app/20_build_ebrasil_warehouse.py:ro
    depends_on:
      objectstore-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_healthy
      spark-worker-1:
        condition: service_healthy
      spark-worker-2:
        condition: service_healthy
    networks:
    - training-net
  ebrasil-druid-init:
    image: bigdata-training/ebrasil-druid:local
    build:
      context: ./docker/ebrasil-druid
    profiles:
    - analytics
    - full
    - checks
    restart: 'no'
    mem_limit: 384m
    environment:
      S3_ENDPOINT: http://objectstore:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-labadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-TRAINING_ONLY_S3_PASSWORD}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      DRUID_URL: http://druid-router:8888
    depends_on:
      ebrasil-silver-init:
        condition: service_completed_successfully
      druid-coordinator:
        condition: service_healthy
      druid-middlemanager:
        condition: service_healthy
      druid-broker:
        condition: service_healthy
      druid-historical:
        condition: service_healthy
      druid-router:
        condition: service_healthy
    networks:
    - training-net
  ebrasil-check:
    image: bigdata-training/ebrasil-druid:local
    build:
      context: ./docker/ebrasil-druid
    profiles:
    - checks
    restart: 'no'
    mem_limit: 384m
    depends_on:
      reports-init:
        condition: service_completed_successfully
      ebrasil-silver-init:
        condition: service_completed_successfully
      ebrasil-druid-init:
        condition: service_completed_successfully
    environment:
      S3_ENDPOINT: http://objectstore:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-labadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-TRAINING_ONLY_S3_PASSWORD}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      DRUID_URL: http://druid-router:8888
    entrypoint:
    - python
    - /checks/run_logged.py
    - --name
    - ebrasil-check
    - --log-dir
    - /reports
    - --
    - python
    - /app/check.py
    volumes:
    - ./checks:/checks:ro
    - ./reports:/reports
    networks:
    - training-net

networks:
  training-net:
    driver: bridge
volumes:
  spark-data: null
  spark-jobs: null
  postgres-source-data: null
  kafka-data: null
  objectstore-data: null
  iceberg-catalog-data: null
  airflow-db-data: null
  spark-notebooks: null
  airflow-logs: null
  pgadmin-data: null
  druid-coordinator-var: null
  druid-broker-var: null
  druid-historical-var: null
  druid-middlemanager-var: null
  druid-router-var: null
  druid-db-data: null
  zookeeper-data: null
  zookeeper-log: null
  superset-db-data: null
  pgadmin-config: null
