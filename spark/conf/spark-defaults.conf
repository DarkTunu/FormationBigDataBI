spark.master                             spark://spark-master:7077

# Delta + Iceberg. All runtime JARs are baked into the custom Spark image.
spark.sql.extensions                    io.delta.sql.DeltaSparkSessionExtension,org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.spark_catalog          org.apache.spark.sql.delta.catalog.DeltaCatalog

# Iceberg REST catalog.
spark.sql.catalog.iceberg                org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.iceberg.type           rest
spark.sql.catalog.iceberg.uri            http://iceberg-rest:8181
spark.sql.catalog.iceberg.warehouse      s3://warehouse/
spark.sql.catalog.iceberg.io-impl        org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.iceberg.s3.endpoint    http://objectstore:9000
spark.sql.catalog.iceberg.s3.path-style-access true
spark.sql.catalog.iceberg.http-client.type urlconnection

# Hadoop S3A for Parquet and Delta.
spark.hadoop.fs.s3a.endpoint             http://objectstore:9000
spark.hadoop.fs.s3a.endpoint.region      us-east-1
spark.hadoop.fs.s3a.path.style.access    true
spark.hadoop.fs.s3a.impl                 org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.connection.ssl.enabled false

# Training defaults adapted from dockerBigData for the Compose cluster.
spark.executor.cores                     1
spark.executor.memory                    1g
spark.driver.memory                      1g
spark.driver.maxResultSize               256m
spark.deploy.defaultCores                4
spark.sql.shuffle.partitions             16
spark.sql.files.maxPartitionBytes       32m
spark.default.parallelism                4
spark.serializer                         org.apache.spark.serializer.KryoSerializer
spark.io.compression.lz4.blockSize       128k
spark.sql.session.timeZone               UTC
spark.sql.ansi.enabled                    false
spark.sql.warehouse.dir                  s3a://lakehouse/spark-warehouse
spark.ui.showConsoleProgress             true

# Shared event logs and History Server.
spark.eventLog.enabled                    true
spark.eventLog.compress                   true
spark.eventLog.dir                        s3a://lakehouse/spark-events
spark.history.fs.logDirectory             s3a://lakehouse/spark-events
spark.history.fs.cleaner.enabled          true
spark.history.fs.cleaner.interval         7d
spark.history.fs.cleaner.maxAge           90d
spark.history.ui.port                     18080

# Python runtime parity.
spark.pyspark.python                    python3
spark.pyspark.driver.python             python3
