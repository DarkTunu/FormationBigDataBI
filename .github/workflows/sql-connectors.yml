name: SQL connectors
on:
  push:
    branches: [master]
    paths: ['compose.yaml', 'trino/**', 'docker/objectstore-init/**', 'docker/postgres-producer/**', 'donnees/ebrasil/**', 'checks/sql_connectors.py', 'checks/run_logged.py', 'tests/test_repository_contract.py', '.github/workflows/sql-connectors.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Start Trino and its SQL dependencies
        run: python checks/run_logged.py --name sql-compose-up -- docker compose --env-file .env --env-file ports.env up -d --build --wait --wait-timeout 600 trino
      - name: Test PostgreSQL and Iceberg federation
        run: python checks/run_logged.py --name sql-connectors -- python checks/sql_connectors.py
      - name: Build and verify eBrasilDW
        run: python checks/run_logged.py --name ebrasil-dw-check -- docker compose --env-file .env --env-file ports.env --profile checks run --rm ebrasil-dw-check
      - name: Collect SQL service container logs
        if: always()
        run: python checks/run_logged.py --name sql-container-logs -- docker compose --env-file .env --env-file ports.env logs --tail=100 trino iceberg-rest objectstore postgres-source
      - name: Clean up SQL test stack
        if: always()
        run: python checks/run_logged.py --name sql-cleanup -- docker compose --env-file .env --env-file ports.env --profile '*' down --volumes --remove-orphans
      - name: Upload check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sql-connector-reports-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14
