name: Repository contracts
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install contract test dependencies
        run: python checks/run_logged.py --name install-contract-dependencies -- pip install -r requirements-checks.txt
      - name: Validate static repository contracts
        run: python checks/run_logged.py --name static-contracts -- python tools/static_validate.py
      - name: Run unit tests
        run: python checks/run_logged.py --name unit-tests -- python -m pytest -q tests
      - name: Validate Docker Compose configuration
        run: python checks/run_logged.py --name compose-config -- docker compose --env-file .env --env-file ports.env --profile full --profile checks config --quiet
      - name: Verify committed checksums
        run: python checks/run_logged.py --name checksums -- sha256sum README.md images/architecture.png && python checks/run_logged.py --name checksums-verify -- sha256sum --quiet --check CHECKSUMS_SHA256.txt
      - name: Upload check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-contracts-reports-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14
